<style>
.credit-item{background:var(--card);border:1px solid var(--line2);border-radius:14px;padding:1rem 1.2rem;margin-bottom:1rem;display:flex;gap:1rem;align-items:center;min-width:0}

<style>
#tryLoader{position:fixed;inset:0;z-index:2000;background:#0e0f12;display:flex;align-items:center;justify-content:center;transition:opacity .6s ease,visibility .6s}
#tryLoader.done{opacity:0;visibility:hidden;pointer-events:none}
#tryLoader .ld-inner{text-align:center;padding:0 1.5rem}
#tryLoader .ld-cloche{width:148px;height:118px;margin:0 auto .9rem}
#tryLoader .ld-cloche svg{width:100%;height:100%;overflow:visible}
#tryLoader .draw{stroke-dasharray:430;stroke-dashoffset:430;animation:lddraw 1.05s ease forwards}
#tryLoader .draw.d2{animation-delay:.16s}#tryLoader .draw.d3{animation-delay:.32s}#tryLoader .draw.d4{animation-delay:.48s}
@keyframes lddraw{to{stroke-dashoffset:0}}
#tryLoader .steam{animation:ldsteam 1.9s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
#tryLoader .steam.s2{animation-delay:.55s}
@keyframes ldsteam{0%,100%{opacity:.15;transform:translateY(3px)}50%{opacity:.9;transform:translateY(-3px)}}
#tryLoader .ld-name{font-family:"Cormorant Garamond",Georgia,serif;font-size:1.9rem;letter-spacing:.42em;padding-left:.42em;color:#ecd9b8}
#tryLoader .ld-tag{color:#a0a0a8;font-size:.82rem;letter-spacing:.14em;margin-top:.65rem;animation:ldpulse 1.7s ease-in-out infinite}
@keyframes ldpulse{0%,100%{opacity:.5}50%{opacity:1}}
#tryLoader .ld-bar{width:210px;max-width:60vw;height:2px;background:rgba(197,168,128,.18);margin:1.25rem auto 0;border-radius:2px;overflow:hidden}
#tryLoader .ld-bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#a8895e,#ecd9b8)}
@media (prefers-reduced-motion:reduce){
#tryLoader .draw{animation:none;stroke-dashoffset:0}
#tryLoader .steam,#tryLoader .ld-tag{animation:none;opacity:1}
}

<script>(function(){var el=document.getElementById('tryLoader');if(!el)return;
function kill(){if(el.parentNode)el.parentNode.removeChild(el)}
if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches){kill();return}
var fill=document.getElementById('ldFill'),t0=performance.now(),DUR=1300;
function tick(now){var p=Math.min(1,(now-t0)/DUR),e=1-Math.pow(1-p,3);
if(fill)fill.style.width=Math.round(e*100)+'%';if(p<1)requestAnimationFrame(tick);}
requestAnimationFrame(tick);
var exited=false,t0b=Date.now(),MINT=1400;
function exit(){if(exited)return;exited=true;el.classList.add('done');setTimeout(kill,750);}
function ready(){setTimeout(exit,Math.max(0,MINT-(Date.now()-t0b)));}
if(document.readyState==='complete')ready();else{window.addEventListener('load',ready);setTimeout(ready,5000);}})();</script>

  (function renderDishCredits(){
    const dl = document.getElementById("dishKreditList");
    if(!dl) return;
    dl.innerHTML = DISH_CREDITS.map(c=>{
      return `<div class="credit-item">
      <img src="${TRY.esc(c.file)}" alt="${TRY.esc(c.emer)}" loading="lazy"/>
      <div><b>${TRY.esc(c.emer)}</b><br/>
      <span style="font-size:.88rem;color:var(--muted)">${TRY.t("kr.photoBy")} ${TRY.esc(c.autor)} · <a href="${TRY.esc(c.url)}" target="_blank" rel="noopener">Wikimedia Commons</a> · ${TRY.t("kr.license")} ${TRY.esc(c.license)}</span></div>
    </div>`;
    }).join("");
  })();
  const list = document.getElementById("kreditList");
  const items = [];
  (window.RESTORANTET||[]).forEach(r => {
    (r.fotot||[]).forEach((f, i) => items.push({r, f, i}));
  });
  if(!items.length){
    list.innerHTML = `<p style="color:var(--muted)">${TRY.t("kr.empty")}</p>`;
    return;
  }
  list.innerHTML = items.map(({r, f}) => {
    const src = f.url ? `<a href="${TRY.esc(f.url)}" target="_blank" rel="noopener">${TRY.esc(f.burim||TRY.t("kr.source"))}</a>` : TRY.esc(f.burim||TRY.t("kr.source"));
