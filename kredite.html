<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TRYEZA — Kreditë e fotove</title>
<meta name="description" content="Atribuimi i fotove të restoranteve në TRYEZA: autorët, burimet dhe licencat.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Ccircle cx='20' cy='20' r='18' fill='%23070b16' stroke='%23d4af37' stroke-width='2'/%3E%3Cpath d='M20 9 L24 20 L20 31 L16 20 Z' fill='%23d4af37'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
.credit-item{background:var(--card);border:1px solid var(--line2);border-radius:14px;padding:1rem 1.2rem;margin-bottom:1rem;display:flex;gap:1rem;align-items:center}
.credit-item img{width:110px;height:80px;object-fit:cover;border-radius:8px;flex:none}
.credit-item a{color:var(--gold-lt)}
.credit-item a:hover{color:var(--gold)}
</style>
</head>
<body>
<header class="site"></header>
<main class="wrap">
  <div class="page-head">
    <span class="eyebrow">Transparencë</span>
    <h1>Kreditë e fotove</h1>
    <p>Çdo foto reale në TRYEZA atribuohet me autorin, burimin dhe licencën e saj. Faleminderit kontribuesve.</p>
  </div>
  <section style="max-width:860px;margin:0 auto;padding-bottom:3rem" id="kreditList"></section>
</main>
<footer class="site"></footer>
<div id="toast"></div>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script>
(function(){
  TRY.renderChrome("kredite.html");
  const list = document.getElementById("kreditList");
  const items = [];
  (window.RESTORANTET||[]).forEach(r => {
    (r.fotot||[]).forEach((f, i) => items.push({r, f, i}));
  });
  if(!items.length){
    list.innerHTML = `<p style="color:var(--muted)">Ende s'ka foto reale të atribuara — po punojmë për to.</p>`;
    return;
  }
  list.innerHTML = items.map(({r, f}) => {
    const src = f.url ? `<a href="${TRY.esc(f.url)}" target="_blank" rel="noopener">${TRY.esc(f.burim||"Burimi")}</a>` : TRY.esc(f.burim||"Burimi");
    return `<div class="credit-item">
      <img src="${TRY.esc(f.file)}" alt="${TRY.esc(r.emer)}" loading="lazy"/>
      <div><b><a href="restorant.html?id=${r.id}">${TRY.esc(r.emer)}</a></b> <span style="color:var(--muted2)">(${TRY.esc(r.qytet)})</span><br/>
      <span style="font-size:.88rem;color:var(--muted)">Foto: ${f.autor?TRY.esc(f.autor)+" · ":""}${src}${f.license?` · Licenca: ${TRY.esc(f.license)}`:""}</span></div>
    </div>`;
  }).join("") + `<p style="color:var(--muted2);font-size:.85rem;margin-top:1.5rem">Nëse je pronar i një fotoje dhe dëshiron ndryshim/heqje, na shkruaj — e rregullojmë menjëherë.</p>`;
})();
</script>
</body>
</html>
