<script>(function(){var el=document.getElementById('tryLoader');if(!el)return;
function kill(){if(el.parentNode)el.parentNode.removeChild(el)}
if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches){kill();return}
var fill=document.getElementById('ldFill'),t0=performance.now(),DUR=1300;
function tick(now){var p=Math.min(1,(now-t0)/DUR),e=1-Math.pow(1-p,3);
if(fill)fill.style.width=Math.round(e*100)+'%';if(p<1)requestAnimationFrame(tick);}
requestAnimationFrame(tick);
var exited=false,t0b=Date.now(),MINT=1400;
function exit(){if(exited)return;exited=true;el.classList.add('done');setTimeout(kill,750);}
function ready(){setTimeout(exit,Math.max(0,MINT-(Date.now()-t0b)));}
if(document.readyState==='complete')ready();else{window.addEventListener('load',ready);setTimeout(ready,5000);}})();</script>

<script>
"use strict";
/* ===== Menu Builder v2 — foto reale + drag&drop + hold-to-remove + firing + order screen ===== */
const params = new URLSearchParams(location.search);
const rest = params.get("id") ? TRY.restById(params.get("id")) : null;
TRY.renderChrome("menu-builder.html");
const $ = TRY.$;

const CATS = ["ane","kryesore","embelsire","pije"];
const CAT_KEY = {ane:"mb.catAne",kryesore:"mb.catKryesore",embelsire:"mb.catEmbelsire",pije:"mb.catPije"};
const CAT_EMOJI = {ane:"\u{1F957}",kryesore:"\u{1F356}",embelsire:"\u{1F370}",pije:"\u{1F377}"};

/* Sugjerime editoriale — pjata tipike shqiptare me çmime tipike (etiketohen qartë) */
const ED = {
  ane:[
    {emer:"Sallatë fshati",cmim:350,foto:"img/pjata/ed-sallate-fshati.jpg"},
    {emer:"Djathë i bardhë me ullinj",cmim:400,foto:"img/pjata/ed-djathe-ullinj.jpg"},
    {emer:"Byrek me spinaq",cmim:300,foto:"img/pjata/ed-byrek-spinaq.jpg"},
    {emer:"Speca të mbushur",cmim:450,foto:"img/pjata/ed-speca-mbushur.jpg"}
  ],
  kryesore:[
    {emer:"Tavë kosi",cmim:850,foto:"img/pjata/fi-tave-kosi.jpg"},
    {emer:"Qofte shtëpie",cmim:700,foto:"img/pjata/ed-qofte.jpg"},
    {emer:"Peshk i ditës në zgarë",cmim:1200,foto:"img/pjata/ed-peshk-zgare.jpg"},
    {emer:"Biftek viçi",cmim:1400,foto:"img/pjata/ed-biftek.jpg"}
  ],
  embelsire:[
    {emer:"Bakllava",cmim:350,foto:"img/pjata/ed-bakllava.jpg"},
    {emer:"Trileçe",cmim:400,foto:"img/pjata/ed-trilece.jpg"},
    {emer:"Akullore artizanale",cmim:300,foto:"img/pjata/ed-akullore.jpg"}
  ],
  pije:[
    {emer:"Verë e kuqe (gotë)",cmim:400,foto:"img/pjata/ed-vere.jpg"},
    {emer:"Raki rrushi",cmim:250},
    {emer:"Ujë mineral",cmim:150},
    {emer:"Lëng portokalli i freskët",cmim:250,foto:"img/pjata/ed-leng-portokalli.jpg"}
  ]
};

function classify(dishes){
  const out = {ane:[],kryesore:[],embelsire:[],pije:[]};
  (dishes||[]).forEach(d=>{
    const n = " "+String(d.emer||"").toLowerCase()+" ";
    let c = "ane";
    if(/(bakllav|trileç|tres leches|akullor|sheqerpare|tort|kek|tiramisu|pana cotta|profiterol|krem karamel)/.test(n)) c="embelsire";
    else if(/(verë(?!s)|rakia?|birr|ujë mineral|lëng|kafe|koktej|gotë|shishe|pije)/.test(n)) c="pije";
    else if(/(tavë|mish|peshk|biftek|zgare|steak|fileto|kombinim|mix|oktapod|levrek|salmon)/.test(n)
            && !/(sallat|carpaccio|tartar|pitja|pite|petulla|bukë|kungull|fërges|djath|byrek)/.test(n)) c="kryesore";
    out[c].push({emer:d.emer, cmim:+d.cmim||0, kat:c, src:"real", foto:d.foto||""});
  });
  return out;
}

const REDUCED = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;

function thumbHTML(d){
  return d.foto
    ? '<img class="mb-thumb" src="'+TRY.esc(d.foto)+'" alt="" loading="lazy" draggable="false">'
    : '<span class="mb-efb">'+(CAT_EMOJI[d.kat]||"🍽️")+'</span>';
}

if(!rest){
  document.title = TRY.t("pg.notFound");
  document.getElementById("mbMain").innerHTML = '<div class="empty" style="margin:3rem 0"><div class="big">🍽️</div>'
    + '<h2>'+TRY.t("det.notFoundT")+'</h2><p>'+TRY.t("det.notFoundD")+'</p>'
    + '<p style="margin-top:1.2rem"><a class="btn btn-gold" href="restorante.html">'+TRY.t("det.backToRest")+'</a></p></div>';
  document.getElementById("mbBar").style.display = "none";
}else{
  document.title = TRY.t("mb.title")+" — "+rest.emer+" — TRYEZA";
  document.getElementById("mbBack").href = "restorant.html?id="+encodeURIComponent(rest.id);
  document.getElementById("mbRestName").textContent = rest.emer+" · "+rest.qytet;

  const real = classify(rest.menu||[]);
  const hasReal = (rest.menu||[]).length>0;

  let sel = [];
  let persona = 2;
  let kitchenNote = "";
  const qp = parseInt(params.get("persona"),10);
  const saved = TRY.menuDraft();
  if(saved && saved.restId===rest.id){
    sel = (saved.items||[]).filter(x=>x && x.emer);
    if(saved.persona>=1 && saved.persona<=20) persona = saved.persona;
    kitchenNote = saved.kitchenNote || "";
  }else if(qp>=1 && qp<=20){ persona = qp; }

  const key = d => d.kat+"|"+d.emer;
  const isSel = d => sel.some(s=>key(s)===key(d));
  function persist(){
    TRY.save(TRY.MB_LS, {restId:rest.id, items:sel, persona:persona, kitchenNote:kitchenNote, editorial:!hasReal, savedAt:new Date().toISOString()});
  }
  function readDish(card){
    return {emer:card.dataset.e, cmim:+card.dataset.c||0, kat:card.dataset.k, src:card.dataset.s, foto:card.dataset.f||""};
  }

  /* ---------- animacioni "fluturon në tavolinë" (WAAPI) ---------- */
  function flyTarget(){
    const t = document.getElementById("mbTableWrap");
    if(!t) return null;
    const r = t.getBoundingClientRect();
    const inView = r.bottom>0 && r.top<window.innerHeight;
    if(inView) return t;
    const bar = document.getElementById("mbBar");
    return (bar && getComputedStyle(bar).display!=="none") ? bar : t;
  }
  function flyToTable(fromEl, dish, done){
    const target = flyTarget();
    if(REDUCED || !target || !fromEl){ done(); return; }
    const r1 = fromEl.getBoundingClientRect();
    const r2 = target.getBoundingClientRect();
    const fly = document.createElement("div");
    fly.className = "mb-fly";
    fly.innerHTML = dish.foto
      ? '<img src="'+TRY.esc(dish.foto)+'" alt="">'
      : (CAT_EMOJI[dish.kat] || "🍽️");
    fly.setAttribute("aria-hidden","true");
    document.body.appendChild(fly);
    const x1 = r1.left+r1.width/2, y1 = r1.top+r1.height/2;
    const x2 = r2.left+r2.width/2, y2 = r2.top+r2.height/2;
    const dx = x2-x1, dy = y2-y1;
    const lift = -Math.min(170, Math.abs(dy)*0.45+70);
    fly.style.left = x1+"px"; fly.style.top = y1+"px";
    let anim;
    try{
      anim = fly.animate([
        { transform:"translate(-50%,-50%) scale(1) rotate(0deg)", opacity:1 },
        { transform:"translate(calc(-50% + "+(dx*0.5)+"px), calc(-50% + "+(dy*0.5+lift)+"px)) scale(.8) rotate(14deg)", opacity:1, offset:.55 },
        { transform:"translate(calc(-50% + "+dx+"px), calc(-50% + "+dy+"px)) scale(.45) rotate(0deg)", opacity:.85 }
      ], { duration:680, easing:"cubic-bezier(.22,.8,.3,1)" });
    }catch(e){ fly.remove(); done(); return; }
    anim.onfinish = ()=>{ fly.remove(); done(); };
  }
  function pulseTotal(){
    if(REDUCED) return;
    ["mbTotal","mbBarTotal"].forEach(id=>{
      const el = document.getElementById(id);
      if(!el) return;
      el.classList.remove("mb-pulse"); void el.offsetWidth; el.classList.add("mb-pulse");
    });
    const tw = document.getElementById("mbTableWrap");
    if(tw){ tw.classList.remove("mb-land"); void tw.offsetWidth; tw.classList.add("mb-land"); }
  }

  function commitAdd(dish, fromEl){
    sel.push(dish);
    persist(); renderCats(); renderPreview(); pulseTotal();
    TRY.toast(TRY.t("mb.addedT",{emer:dish.emer}));
  }
  function toggleDish(dish, fromEl){
    const i = sel.findIndex(s=>key(s)===key(dish));
    if(i>=0){
      const rm = sel.splice(i,1)[0];
      persist(); renderCats(); renderPreview();
      TRY.toast(TRY.t("mb.removedT",{emer:rm.emer}));
    }else{
      flyToTable(fromEl||null, dish, ()=>commitAdd(dish));
    }
  }

  /* ---------- drag & drop mbi tavolinë (Pointer Events: mouse + touch) ---------- */
  function bindDrag(card){
    const dish = readDish(card);
    let st = null, ghost = null;
    function cleanup(){
      if(st && st.holdT){ clearTimeout(st.holdT); }
      if(ghost){ ghost.remove(); ghost = null; }
      card.classList.remove("dragging");
      st = null;
    }
    function moveGhost(e){
      if(ghost){ ghost.style.left = e.clientX+"px"; ghost.style.top = e.clientY+"px"; }
    }
    function beginDrag(e){
      if(!st || st.dragging) return;
      st.dragging = true;
      card.classList.add("dragging");
      try{ card.setPointerCapture(st.id); }catch(_){}
      ghost = document.createElement("div");
      ghost.className = "mb-drag-ghost";
      ghost.innerHTML = dish.foto
        ? '<img src="'+TRY.esc(dish.foto)+'" alt="">'
        : '<span class="ge">'+(CAT_EMOJI[dish.kat]||"🍽️")+'</span>';
      document.body.appendChild(ghost);
      moveGhost(e);
    }
    card.addEventListener("pointerdown", e=>{
      if(e.target.closest(".mb-add")) return;
      st = {id:e.pointerId, x0:e.clientX, y0:e.clientY, dragging:false, holdT:0};
      if(e.pointerType==="touch"){
        st.holdT = setTimeout(()=>{ if(st && !st.dragging) beginDrag(e); }, 260);
      }
    });
    card.addEventListener("pointermove", e=>{
      if(!st || e.pointerId!==st.id) return;
      const moved = Math.hypot(e.clientX-st.x0, e.clientY-st.y0);
      if(!st.dragging){
        if(e.pointerType!=="touch" && moved>9){ beginDrag(e); }
        else if(e.pointerType==="touch" && moved>12){ cleanup(); }
        return;
      }
      moveGhost(e);
    });
    function finish(e){
      if(!st || e.pointerId!==st.id) return;
      if(e.target.closest && e.target.closest(".mb-add")){ cleanup(); return; }
      const wasDragging = st.dragging;
      const moved = Math.hypot(e.clientX-st.x0, e.clientY-st.y0);
      const g = ghost;
      cleanup();
      if(wasDragging){
        const el = document.elementFromPoint(e.clientX, e.clientY);
        const tw = el && el.closest ? el.closest("#mbTableWrap") : null;
        if(tw){ toggleDish(dish, card); }
      }else if(moved<10){
        toggleDish(dish, card);
      }
    }
    card.addEventListener("pointerup", finish);
    card.addEventListener("pointercancel", ()=>cleanup());
  }

  /* ---------- hold-to-remove mbi tavolinë ---------- */
  function bindHoldRemove(scope){
    scope.querySelectorAll(".mb-tdish").forEach(el=>{
      let t = null;
      const cancel = ()=>{ if(t){ clearTimeout(t); t=null; } el.classList.remove("mb-shake"); };
      el.addEventListener("pointerdown", e=>{
        e.preventDefault();
        el.classList.add("mb-shake");
        t = setTimeout(()=>{
          t = null; el.classList.remove("mb-shake");
          const i = +el.getAttribute("data-i");
          if(i>=0 && i<sel.length){
            const rm = sel.splice(i,1)[0];
            persist(); renderCats(); renderPreview();
            TRY.toast(TRY.t("mb.removedT",{emer:rm.emer}));
          }
        }, 600);
      });
      el.addEventListener("pointerup", cancel);
      el.addEventListener("pointerleave", cancel);
      el.addEventListener("pointercancel", cancel);
    });
  }

  function renderCats(){
    const box = document.getElementById("mbCats");
    box.innerHTML = CATS.map(c=>{
      const realD = real[c];
      const list = realD.length ? realD : ED[c].map(e=>({emer:e.emer,cmim:e.cmim,kat:c,src:"ed",foto:e.foto||""}));
      const edOnly = !realD.length;
      const tag = realD.length
        ? '<span class="ed-tag" style="background:rgba(62,207,142,.12);border-color:rgba(62,207,142,.35);color:#7fe0ae">'+TRY.t("mb.realMenu")+'</span>'
        : '<span class="ed-tag">'+TRY.t("mb.editorial")+'</span>';
      const note = '<div class="mb-src">'+tag+(edOnly ? " "+TRY.esc(TRY.t("mb.editorialNote")) : "")+'</div>';
      return '<section class="mb-cat"><h2>'+TRY.t(CAT_KEY[c])+'</h2>'+note
        + '<div class="mb-grid">'+list.map(d=>{
          const on = isSel(d);
          return '<div class="mb-dish'+(on?" sel":"")+'"'
            + ' data-k="'+TRY.esc(d.kat)+'" data-e="'+TRY.esc(d.emer)+'" data-c="'+d.cmim+'" data-s="'+d.src+'" data-f="'+TRY.esc(d.foto||"")+'">'
            + thumbHTML(d)
            + '<div class="nm"><b>'+TRY.esc(d.emer)+'</b><span>'+(d.cmim? d.cmim+" L":"—")+'</span></div>'
            + '<button class="mb-add'+(on?" on":"")+'"'
            + ' aria-label="'+TRY.esc(TRY.t(on?"mb.added":"mb.add"))+'" aria-pressed="'+on+'">'+(on?"✓":"+")
            + '</button></div>';
        }).join("")+'</div></section>';
    }).join("");
    box.querySelectorAll(".mb-dish").forEach(card=>{
      const dish = readDish(card);
      card.querySelector(".mb-add").addEventListener("click", ev=>{
        ev.stopPropagation();
        toggleDish(dish, card);
      });
      bindDrag(card);
    });
  }

  function renderTableDishes(){
    const g = document.getElementById("mbTableDishes");
    if(!g) return;
    const n = sel.length;
    g.innerHTML = sel.map((d,i)=>{
      const a = n===1 ? -Math.PI/2 : -Math.PI/2 + i*(Math.PI*2/n);
      const x = 100+56*Math.cos(a), y = 100+56*Math.sin(a);
      const inner = d.foto
        ? '<image href="'+TRY.esc(d.foto)+'" x="'+(x-13).toFixed(1)+'" y="'+(y-13).toFixed(1)+'" width="26" height="26" style="clip-path:circle(50%)"/>'
        : '<text x="'+x.toFixed(1)+'" y="'+(y+7).toFixed(1)+'" text-anchor="middle" font-size="19">'+(CAT_EMOJI[d.kat]||"🍽️")+'</text>';
      return '<g class="mb-tdish" data-i="'+i+'"><title>'+TRY.esc(d.emer)+'</title>'+inner+'</g>';
    }).join("");
    bindHoldRemove(g);
  }

  function renderPreview(){
    const list = document.getElementById("mbList");
    const perP = sel.reduce((s,d)=>s+(+d.cmim||0),0);
    const tot = perP*persona;
    const fmt = v => v.toLocaleString("sq-AL")+" L";
    if(!sel.length){
      list.innerHTML = '<div class="mb-empty">'+TRY.t("mb.empty")+'</div>';
    }else{
      list.innerHTML = CATS.filter(c=>sel.some(d=>d.kat===c)).map(c=>
        '<span class="cat-lbl">'+TRY.t(CAT_KEY[c])+'</span>' +
        sel.filter(d=>d.kat===c).map(d=>{
          const th = d.foto
            ? '<img class="mt" src="'+TRY.esc(d.foto)+'" alt="" loading="lazy">'
            : '<span class="me">'+(CAT_EMOJI[d.kat]||"🍽️")+'</span>';
          return '<div class="mb-item"><span>'+th+'<span>'+TRY.esc(d.emer)+'</span></span>'
          + '<span><span class="pr">'+d.cmim+' L</span> <button class="rm" data-k="'+TRY.esc(d.kat)+'" data-e="'+TRY.esc(d.emer)+'" aria-label="'+TRY.esc(TRY.t("mb.remove"))+'">×</button></span></div>';
        }).join("")
      ).join("");
      list.querySelectorAll(".rm").forEach(b=>b.addEventListener("click",()=>{
        const i = sel.findIndex(s=>s.kat===b.dataset.k && s.emer===b.dataset.e);
        if(i>=0){ const rm = sel.splice(i,1)[0]; TRY.toast(TRY.t("mb.removedT",{emer:rm.emer})); }
        persist(); renderCats(); renderPreview();
      }));
    }
    renderTableDishes();
    const hint = document.getElementById("mbHint");
    if(hint) hint.textContent = TRY.t(sel.length===0?"mb.hint0":sel.length===1?"mb.hint1":"mb.hint2");
    document.getElementById("mbPerP").textContent = fmt(perP);
    document.getElementById("mbTotalLbl").textContent = TRY.t("mb.totalFor",{n:persona});
    document.getElementById("mbTotal").textContent = fmt(tot);
    document.getElementById("mbBarTotal").textContent = fmt(tot);
    const cta = document.getElementById("mbCta"), bar = document.getElementById("mbBarCta");
    if(sel.length){
      cta.innerHTML = TRY.t("mb.fire"); cta.disabled = false;
      bar.innerHTML = TRY.t("mb.fire");
    }else{
      cta.innerHTML = TRY.t("mb.ctaEmpty"); cta.disabled = true;
      bar.innerHTML = "+";
    }
    document.getElementById("gNum").textContent = persona;
    const rn = document.getElementById("mbResNum");
    if(rn) rn.textContent = persona;
  }

  /* ---------- firing: "Dërgo në kuzhinë 🔥" ---------- */
  function startFiring(){
    if(!sel.length){ TRY.toast(TRY.t("mb.ctaEmpty")); return; }
    if(REDUCED){ openOrder(); return; }
    const tw = document.getElementById("mbTableWrap");
    const ov = document.createElement("div");
    ov.className = "mb-fire-ov";
    ov.innerHTML = '<div class="flames"><i class="fl"></i><i class="fl"></i><i class="fl"></i><i class="fl"></i><i class="fl"></i></div><p>'+TRY.esc(TRY.t("mb.firing"))+'</p>';
    tw.appendChild(ov);
    setTimeout(()=>{
      ov.remove();
      tw.classList.add("cooked");
      TRY.toast(TRY.t("mb.cookedT"));
      setTimeout(openOrder, 380);
    }, 2000);
  }

  /* ---------- order screen ---------- */
  function orderGroups(){
    const m = new Map();
    sel.forEach(d=>{
      const k = key(d);
      if(!m.has(k)) m.set(k, {d:d, qty:0});
      m.get(k).qty++;
    });
    return [...m.values()];
  }
  function renderOrderLines(){
    const box = document.getElementById("mbOrderLines");
    const fmt = v => v.toLocaleString("sq-AL")+" L";
    box.innerHTML = orderGroups().map(g=>{
      const d = g.d;
      const th = d.foto
        ? '<img src="'+TRY.esc(d.foto)+'" alt="" loading="lazy">'
        : '<span class="oe">'+(CAT_EMOJI[d.kat]||"🍽️")+'</span>';
      return '<div class="mb-oline">'+th
        + '<div class="on"><b>'+TRY.esc(d.emer)+'</b><span>'+fmt(d.cmim)+' · '+TRY.t("mb.perPerson")+'</span></div>'
        + '<div class="qstep"><button data-act="dec" data-k="'+TRY.esc(d.kat)+'" data-e="'+TRY.esc(d.emer)+'" aria-label="−">−</button>'
        + '<b>'+g.qty+'</b>'
        + '<button data-act="inc" data-k="'+TRY.esc(d.kat)+'" data-e="'+TRY.esc(d.emer)+'" aria-label="+">+</button></div>'
        + '</div>';
    }).join("");
    box.querySelectorAll(".qstep button").forEach(b=>b.addEventListener("click",()=>{
      const k = b.dataset.k, e = b.dataset.e;
      if(b.dataset.act==="inc"){
        const d = sel.find(s=>s.kat===k && s.emer===e);
        if(d) sel.push({emer:d.emer,cmim:d.cmim,kat:d.kat,src:d.src,foto:d.foto||""});
      }else{
        const i = sel.findIndex(s=>s.kat===k && s.emer===e);
        if(i>=0) sel.splice(i,1);
      }
      persist(); renderCats(); renderPreview(); renderOrderLines(); updateOrderTotals();
    }));
  }
  function updateOrderTotals(){
    const perP = sel.reduce((s,d)=>s+(+d.cmim||0),0);
    const fmt = v => v.toLocaleString("sq-AL")+" L";
    document.getElementById("mbOrderPerP").textContent = fmt(perP);
    document.getElementById("mbOrderTotalLbl").textContent = TRY.t("mb.totalFor",{n:persona});
    document.getElementById("mbOrderTotal").textContent = fmt(perP*persona);
    const go = document.getElementById("mbOrderGo");
    go.innerHTML = sel.length ? TRY.t("mb.cta",{total:(perP*persona).toLocaleString("sq-AL")}) : TRY.t("mb.ctaEmpty");
    go.disabled = !sel.length;
  }
  function openOrder(){
    renderOrderLines();
    document.getElementById("mbKitchen").value = kitchenNote || "";
    initResFields();
    updateOrderTotals();
    const ov = document.getElementById("mbOrderOv");
    ov.classList.add("open");
    ov.setAttribute("aria-hidden","false");
    document.body.style.overflow = "hidden";
  }
  /* ---------- detajet e rezervimit në ekranin e porosisë ---------- */
  function initResFields(){
    const d = document.getElementById("mbResDate");
    d.min = TRY.todayStr(); d.max = TRY.todayStr(60);
    if(!d.value || d.value < d.min || d.value > d.max) d.value = TRY.todayStr();
    const t = document.getElementById("mbResTime");
    if(!t.options.length){
      t.innerHTML = TRY.SLOTS.map(s=>'<option value="'+s+'"'+(s==="20:00"?" selected":"")+'>'+s+'</option>').join("");
    }
    document.getElementById("mbResNum").textContent = persona;
    /* fshihe butonin WhatsApp nëse restoranti s'ka numër publik */
    const waBtn = document.getElementById("mbWaAll");
    if(waBtn) waBtn.style.display = TRY.waLink(rest, "x") ? "" : "none";
  }
  function setPersona(n){
    n = Math.max(1, Math.min(20, n));
    if(n===persona) return;
    persona = n;
    persist(); renderPreview(); renderOrderLines(); updateOrderTotals();
    document.getElementById("mbResNum").textContent = persona;
  }
  function closeOrder(){
    const ov = document.getElementById("mbOrderOv");
    ov.classList.remove("open");
    ov.setAttribute("aria-hidden","true");
    document.body.style.overflow = "";
  }
  document.getElementById("mbOrderBack").addEventListener("click", closeOrder);
  document.getElementById("mbOrderOv").addEventListener("click", e=>{
    if(e.target.id==="mbOrderOv") closeOrder();
  });
  document.getElementById("mbOrderGo").addEventListener("click", ()=>{
    if(!sel.length){ TRY.toast(TRY.t("mb.ctaEmpty")); return; }
    kitchenNote = document.getElementById("mbKitchen").value.trim();
    closeOrder();
    goBooking();
  });

  function goBooking(){
    if(!sel.length){ TRY.toast(TRY.t("mb.ctaEmpty")); return; }
    persist();
    TRY.toast(TRY.t("mb.savedT"));
    setTimeout(()=>{ location.href = "restorant.html?id="+encodeURIComponent(rest.id); }, 450);
  }
  /* ---------- "Dërgo gjithçka me WhatsApp": rezervim real + wa.me ---------- */
  function waSendAll(){
    if(!sel.length){ TRY.toast(TRY.t("mb.ctaEmpty")); return; }
    const emer = document.getElementById("mbResName").value.trim();
    const date = document.getElementById("mbResDate").value;
    const time = document.getElementById("mbResTime").value;
    if(emer.length < 3){ TRY.toast(TRY.t("mb.errName")); document.getElementById("mbResName").focus(); return; }
    if(!date || date < TRY.todayStr() || date > TRY.todayStr(60)){ TRY.toast(TRY.t("mb.errDate")); return; }
    kitchenNote = document.getElementById("mbKitchen").value.trim();
    persist();
    const menuItems = sel.map(d=>({emer:d.emer, cmim:+d.cmim||0, kat:d.kat, src:d.src, foto:d.foto||""}));
    const b = TRY.createBooking({
      restId: rest.id, restEmer: rest.emer,
      date: date, time: time, persona: persona,
      emer: emer, telefon: "", email: "",
      rasti: "", shenime: kitchenNote,
      tavolina: [],
      menu: { items: menuItems, kitchenNote: kitchenNote, editorial: !hasReal },
      waDirect: true
    });
    const en = TRY.lang() === "en";
    const fmt = v => (+v).toLocaleString("sq-AL");
    const groups = orderGroups();
    const menuLines = groups.map(g=>"• "+g.d.emer+" ×"+g.qty+" — "+fmt(g.d.cmim*g.qty)+" L").join("\n");
    const total = menuItems.reduce((s,d)=>s+d.cmim,0)*persona;
    const note = kitchenNote ? (en ? "\n📝 Note: "+kitchenNote : "\n📝 Shënim: "+kitchenNote) : "";
    const msg = TRY.t("mb.waMsg", {
      rest: rest.emer, code: b.code,
      data: TRY.fmtDate(date), date: TRY.fmtDate(date),
      ora: time, time: time,
      persona: persona, emer: emer, name: emer,
      menu: menuLines, total: fmt(total), note: note
    });
    const url = TRY.waLink(rest, msg);
    closeOrder();
    TRY.toast(TRY.t("mb.waSaved",{code:b.code}));
    if(url) window.open(url, "_blank", "noopener");
  }
  document.getElementById("mbWaAll").addEventListener("click", waSendAll);
  document.getElementById("mbResMinus").addEventListener("click", ()=>setPersona(persona-1));
  document.getElementById("mbResPlus").addEventListener("click", ()=>setPersona(persona+1));
  document.getElementById("mbCta").addEventListener("click", startFiring);
  document.getElementById("mbBarCta").addEventListener("click", startFiring);
  document.getElementById("mbReset").addEventListener("click", ()=>{
    sel = []; kitchenNote = ""; closeOrder();
    const tw = document.getElementById("mbTableWrap");
    if(tw) tw.classList.remove("cooked");
    persist(); renderCats(); renderPreview(); TRY.toast(TRY.t("mb.resetDone"));
  });
  document.getElementById("gMinus").addEventListener("click", ()=>{ if(persona>1){persona--; persist(); renderPreview();} });
  document.getElementById("gPlus").addEventListener("click", ()=>{ if(persona<20){persona++; persist(); renderPreview();} });

  renderCats(); renderPreview();
  persist();
}

</script>
</body>
</html>
