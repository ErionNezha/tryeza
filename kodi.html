<link rel="stylesheet" href="css/style.css">
<style>
#tryLoader{position:fixed;inset:0;z-index:2000;background:#0e0f12;display:flex;align-items:center;justify-content:center;transition:opacity .6s ease,visibility .6s}
#tryLoader.done{opacity:0;visibility:hidden;pointer-events:none}
#tryLoader .ld-inner{text-align:center;padding:0 1.5rem}
#tryLoader .ld-cloche{width:148px;height:118px;margin:0 auto .9rem}
#tryLoader .ld-cloche svg{width:100%;height:100%;overflow:visible}
#tryLoader .draw{stroke-dasharray:430;stroke-dashoffset:430;animation:lddraw 1.05s ease forwards}
#tryLoader .draw.d2{animation-delay:.16s}#tryLoader .draw.d3{animation-delay:.32s}#tryLoader .draw.d4{animation-delay:.48s}
@keyframes lddraw{to{stroke-dashoffset:0}}
#tryLoader .steam{animation:ldsteam 1.9s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
#tryLoader .steam.s2{animation-delay:.55s}
@keyframes ldsteam{0%,100%{opacity:.15;transform:translateY(3px)}50%{opacity:.9;transform:translateY(-3px)}}
#tryLoader .ld-name{font-family:"Cormorant Garamond",Georgia,serif;font-size:1.9rem;letter-spacing:.42em;padding-left:.42em;color:#ecd9b8}
#tryLoader .ld-tag{color:#a0a0a8;font-size:.82rem;letter-spacing:.14em;margin-top:.65rem;animation:ldpulse 1.7s ease-in-out infinite}
@keyframes ldpulse{0%,100%{opacity:.5}50%{opacity:1}}
#tryLoader .ld-bar{width:210px;max-width:60vw;height:2px;background:rgba(197,168,128,.18);margin:1.25rem auto 0;border-radius:2px;overflow:hidden}
#tryLoader .ld-bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#a8895e,#ecd9b8)}
@media (prefers-reduced-motion:reduce){
#tryLoader .draw{animation:none;stroke-dashoffset:0}
#tryLoader .steam,#tryLoader .ld-tag{animation:none;opacity:1}
}
</style></head>
<body><div id="tryLoader" aria-hidden="true"><div class="ld-inner">
<div class="ld-cloche"><svg viewBox="0 0 120 96" fill="none" aria-hidden="true">
<path class="steam s1" d="M44 32 q5 -7 0 -14 q-5 -7 0 -13" stroke="#c5a880" stroke-width="1.6" stroke-linecap="round"/>
<path class="steam s2" d="M76 32 q-5 -7 0 -14 q5 -7 0 -13" stroke="#c5a880" stroke-width="1.6" stroke-linecap="round"/>
<path class="draw" d="M22 72 A38 38 0 0 1 98 72" stroke="#c5a880" stroke-width="1.8" stroke-linecap="round"/>
<line class="draw d2" x1="14" y1="72" x2="106" y2="72" stroke="#c5a880" stroke-width="1.8" stroke-linecap="round"/>
<circle class="draw d3" cx="60" cy="28" r="4" stroke="#ecd9b8" stroke-width="1.6"/>
<line class="draw d3" x1="60" y1="32" x2="60" y2="37" stroke="#ecd9b8" stroke-width="1.6"/>
<ellipse class="draw d4" cx="60" cy="81" rx="50" ry="8" stroke="#a8895e" stroke-width="1.4"/>
<g class="draw d4" stroke="#c5a880" stroke-width="1.5" stroke-linecap="round">
<line x1="7" y1="52" x2="7" y2="68"/><line x1="3" y1="52" x2="3" y2="60"/><line x1="7" y1="52" x2="7" y2="60"/><line x1="11" y1="52" x2="11" y2="60"/><line x1="3" y1="60" x2="11" y2="60"/>
</g>
<g class="draw d4" stroke="#c5a880" stroke-width="1.5" stroke-linecap="round">
<line x1="113" y1="52" x2="113" y2="68"/><path d="M113 52 L117 52 L115 40 Z" fill="#c5a880" stroke="none" opacity=".85"/>
</g>
</svg></div>
<div class="ld-name">TRYEZA</div>
<div class="ld-tag" data-i18n="loader.tag2">Po bëjmë gati tavolinën tënde...</div>
<div class="ld-bar"><i id="ldFill"></i></div>
</div></div>
<script>(function(){var el=document.getElementById('tryLoader');if(!el)return;
function kill(){if(el.parentNode)el.parentNode.removeChild(el)}
if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches){kill();return}
var fill=document.getElementById('ldFill'),t0=performance.now(),DUR=1300;
function tick(now){var p=Math.min(1,(now-t0)/DUR),e=1-Math.pow(1-p,3);
if(fill)fill.style.width=Math.round(e*100)+'%';if(p<1)requestAnimationFrame(tick);}
requestAnimationFrame(tick);
var exited=false,t0b=Date.now(),MINT=1400;
function exit(){if(exited)return;exited=true;el.classList.add('done');setTimeout(kill,750);}
function ready(){setTimeout(exit,Math.max(0,MINT-(Date.now()-t0b)));}
if(document.readyState==='complete')ready();else{window.addEventListener('load',ready);setTimeout(ready,5000);}})();</script>
<header class="site"></header>
<main class="wrap">
  <div class="page-head">
    <span class="eyebrow" data-i18n="kc.eyebrow">Transparencë</span>
    <h1 data-i18n="kc.h1">Kodi burimor</h1>
    <p data-i18n="kc.sub">TRYEZA është ndërtuar hapur. Shfleto çdo file, kopjo copëza kodi dhe shiko si funksionon platforma — pa fshehtësi.</p>
  </div>
  <section style="padding-top:.4rem">
    <div style="display:flex;gap:.6rem;flex-wrap:wrap;justify-content:center;margin-bottom:1.6rem">
      <button class="btn btn-gold btn-sm" id="showAll" data-i18n="kc.showAll">Shfaq të gjitha</button>
      <a class="btn btn-ghost btn-sm" href="https://github.com/erionnezha/tryeza" target="_blank" rel="noopener" data-i18n="kc.github">↗ Hap në GitHub</a>
    </div>
    <div id="fileList"></div>
    <p class="hint" style="text-align:center;margin-top:1rem" data-i18n="kc.note">Ngjyrosja e sintaksës bëhet me një highlighter të brendshëm JavaScript — pa libra të jashtëm.</p>
  </section>
</main>
<footer class="site"></footer>
<script src="js/data.js"></script>
<script src="js/i18n.js"></script>
<script src="js/app.js"></script>
<script>
"use strict";
TRY.renderChrome("kodi.html");

const FILES = [
  ["index.html", TRY.t("kc.d1")],
  ["restorante.html", TRY.t("kc.d2")],
  ["restorant.html", TRY.t("kc.d3")],
  ["rezervimet.html", TRY.t("kc.d4")],
  ["sugjero.html", TRY.t("kc.d5")],
  ["dashboard.html", TRY.t("kc.d6")],
  ["blog.html", TRY.t("kc.d7")],
  ["faq.html", TRY.t("kc.d8")],
  ["kodi.html", TRY.t("kc.d9")],
  ["css/style.css", TRY.t("kc.d10")],
  ["js/app.js", TRY.t("kc.d11")],
  ["js/data.js", TRY.t("kc.d12")]
];
const cache = {};

const esc = TRY.esc;
function highlight(src){
  const re = /(<!--[\s\S]*?-->)|(\/\*[\s\S]*?\*\/|\/\/[^\n]*)|(`(?:\\.|[^`\\])*`|"(?:\\.|[^"\\\n])*"|'(?:\\.|[^'\\\n])*')|(<\/?[A-Za-z][\w-]*(?:\s+[\w-]+(?:=(?:"[^"]*"|'[^']*'|[^\s>]+))?)*\s*\/?>)|(\b\d+(?:\.\d+)?\b)|(\b(?:const|let|var|function|return|if|else|for|while|do|switch|case|break|continue|new|typeof|instanceof|in|of|try|catch|finally|throw|class|extends|import|export|from|default|async|await|null|true|false|undefined|this|document|window|localStorage|navigator|location|JSON|Math|Array|Object|String|Number|Date|Promise|setTimeout|clearTimeout)\b)/g;
  let out = "", last = 0, m;
  while((m = re.exec(src))){
    out += esc(src.slice(last, m.index));
    const tok = m[0];
    if(m[1] || m[2]) out += '<span class="tok-c">' + esc(tok) + "</span>";
    else if(m[3]) out += '<span class="tok-s">' + esc(tok) + "</span>";
    else if(m[4]) out += '<span class="tok-t">' + esc(tok) + "</span>";
    else if(m[5]) out += '<span class="tok-n">' + esc(tok) + "</span>";
    else if(m[6]) out += '<span class="tok-k">' + esc(tok) + "</span>";
    last = m.index + tok.length;
  }
  return out + esc(src.slice(last));
}

async function fetchFile(f){
  if(cache[f]) return cache[f];
  const res = await fetch(f);
  if(!res.ok) throw new Error("HTTP " + res.status);
  const txt = await res.text();
  cache[f] = txt;
  return txt;
}

function renderBody(file, body){
  const f = file.f;
  if(cache[f]){
    body.innerHTML = "<pre>" + highlight(cache[f]) + "</pre>";
    return;
  }
  body.innerHTML = `<p class="hint">${TRY.t("kc.loading")}</p>`;
  fetchFile(f).then(txt => {
    if(body.dataset.loaded === f) body.innerHTML = "<pre>" + highlight(txt) + "</pre>";
  }).catch(() => {
    if(body.dataset.loaded === f){
      body.innerHTML = `<div class="empty" style="border:none;padding:1.6rem">
        <div class="big">📂</div>
        <p>${TRY.t("kc.loadFailT",{f:esc(f)}).replace("{link}",`<a href="https://github.com/erionnezha/tryeza" target="_blank" rel="noopener" style="color:var(--gold)">GitHub</a>`)}</p>
      </div>`;
    }
  });
}

const list = TRY.$("#fileList");
list.innerHTML = FILES.map(([f, desc], i) => `
  <div class="code-file" data-file="${esc(f)}">
    <div class="code-head">
      <span><b>${esc(f)}</b> <span style="color:var(--muted2)">— ${esc(desc)}</span></span>
      <span style="display:flex;gap:.4rem">
        <button data-show="${i}">${TRY.t("kc.show")}</button>
        <button data-copy="${i}">${TRY.t("kc.copy")}</button>
      </span>
    </div>
    <div class="code-body" data-body="${i}"><p class="hint">${TRY.t("kc.clickShow")}</p></div>
  </div>`).join("");

list.addEventListener("click", async e => {
  const sh = e.target.closest("button[data-show]");
  const cp = e.target.closest("button[data-copy]");
  if(sh){
    const i = +sh.dataset.show, f = FILES[i][0];
    const body = list.querySelector(`[data-body="${i}"]`);
    body.dataset.loaded = f;
    sh.textContent = TRY.t("kc.refresh");
    renderBody({ f }, body);
  } else if(cp){
    const i = +cp.dataset.copy, f = FILES[i][0];
    try {
      const txt = await fetchFile(f);
      try { await navigator.clipboard.writeText(txt); }
      catch {
        const ta = document.createElement("textarea");
        ta.value = txt; document.body.appendChild(ta); ta.select();
        document.execCommand("copy"); ta.remove();
      }
      TRY.toast(`<b>${esc(f)}</b> ${TRY.t("kc.copied")}`);
    } catch {
      TRY.toast(TRY.t("kc.copyFail"));
    }
  }
});

TRY.$("#showAll").addEventListener("click", () => {
  FILES.forEach(([f], i) => {
    const body = list.querySelector(`[data-body="${i}"]`);
    body.dataset.loaded = f;
    renderBody({ f }, body);
    const sh = list.querySelector(`button[data-show="${i}"]`);
    if(sh) sh.textContent = TRY.t("kc.refresh");
  });
  TRY.toast(TRY.t("kc.showAllToast"));
});
</script>
</body>
</html>
