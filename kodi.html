<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="pg.kodi">TRYEZA — Kodi burimor</title>
<meta name="description" content="Kodi burimor i platformës TRYEZA — shfleto, kopjo dhe mëso si është ndërtuar.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Ccircle cx='20' cy='20' r='18' fill='%23070b16' stroke='%23d4af37' stroke-width='2'/%3E%3Cpath d='M20 9 L24 20 L20 31 L16 20 Z' fill='%23d4af37'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
<style>
#tryLoader{position:fixed;inset:0;z-index:2000;background:#05080f;display:flex;align-items:center;justify-content:center;transition:opacity .55s ease}
#tryLoader.done{opacity:0;pointer-events:none}
#tryLoader .ld-inner{text-align:center;padding:0 1rem}
#tryLoader .ld-mark{width:84px;height:84px;margin:0 auto .9rem}
#tryLoader .ld-name{font-family:Georgia,'Times New Roman',serif;font-size:1.85rem;letter-spacing:.34em;padding-left:.34em;color:#f0d47a}
#tryLoader .ld-tag{color:#7d86a1;font-size:.78rem;letter-spacing:.24em;text-transform:uppercase;margin-top:.4rem}
#tryLoader .ld-bar{width:210px;max-width:60vw;height:2px;background:rgba(212,175,55,.18);margin:1.3rem auto 0;border-radius:2px;overflow:hidden}
#tryLoader .ld-bar span{display:block;height:100%;width:0;background:linear-gradient(90deg,#9c7c24,#f0d47a);animation:ldfill 1.25s ease forwards}
@keyframes ldfill{to{width:100%}}
#tryLoader .ld-mark circle,#tryLoader .ld-mark path{stroke-dasharray:130;stroke-dashoffset:130;animation:lddraw 1.15s ease forwards}
#tryLoader .ld-mark path:nth-of-type(2){animation-delay:.18s}
@keyframes lddraw{to{stroke-dashoffset:0}}
</style></head>
<body><div id="tryLoader" aria-hidden="true"><div class="ld-inner">
<svg class="ld-mark" viewBox="0 0 40 40" fill="none" aria-hidden="true"><circle cx="20" cy="20" r="18" stroke="#d4af37" stroke-width="1.4"/><path d="M20 8 L24 20 L20 32 L16 20 Z" stroke="#f0d47a" stroke-width="1.4"/><path d="M8 20 L20 16 L32 20 L20 24 Z" stroke="#d4af37" stroke-width="1" opacity=".7"/></svg>
<div class="ld-name">TRYEZA</div>
<div class="ld-tag" data-i18n="loader.tag">Rezervo tavolinën tënde</div>
<div class="ld-bar"><span></span></div>
</div></div>
<script>(function(){var el=document.getElementById('tryLoader');if(!el)return;var t0=Date.now();function done(){if(el.classList.contains('done'))return;var w=Math.max(0,1250-(Date.now()-t0));setTimeout(function(){el.classList.add('done');setTimeout(function(){if(el.parentNode)el.parentNode.removeChild(el)},650)},w)}if(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches){if(el.parentNode)el.parentNode.removeChild(el);return}if(document.readyState==='complete'){done()}else{window.addEventListener('load',done);setTimeout(done,4500)}})();</script>
<header class="site"></header>
<main class="wrap">
  <div class="page-head">
    <span class="eyebrow" data-i18n="kc.eyebrow">Transparencë</span>
    <h1 data-i18n="kc.h1">Kodi burimor</h1>
    <p data-i18n="kc.sub">TRYEZA është ndërtuar hapur. Shfleto çdo file, kopjo copëza kodi dhe shiko si funksionon platforma — pa fshehtësi.</p>
  </div>
  <section style="padding-top:.4rem">
    <div style="display:flex;gap:.6rem;flex-wrap:wrap;justify-content:center;margin-bottom:1.6rem">
      <button class="btn btn-gold btn-sm" id="showAll" data-i18n="kc.showAll">Shfaq të gjitha</button>
      <a class="btn btn-ghost btn-sm" href="https://github.com/erionnezha/tryeza" target="_blank" rel="noopener" data-i18n="kc.github">↗ Hap në GitHub</a>
    </div>
    <div id="fileList"></div>
    <p class="hint" style="text-align:center;margin-top:1rem" data-i18n="kc.note">Ngjyrosja e sintaksës bëhet me një highlighter të brendshëm JavaScript — pa libra të jashtëm.</p>
  </section>
</main>
<footer class="site"></footer>
<script src="js/data.js"></script>
<script src="js/i18n.js"></script>
<script src="js/app.js"></script>
<script>
"use strict";
TRY.renderChrome("kodi.html");

const FILES = [
  ["index.html", TRY.t("kc.d1")],
  ["restorante.html", TRY.t("kc.d2")],
  ["restorant.html", TRY.t("kc.d3")],
  ["rezervimet.html", TRY.t("kc.d4")],
  ["sugjero.html", TRY.t("kc.d5")],
  ["dashboard.html", TRY.t("kc.d6")],
  ["blog.html", TRY.t("kc.d7")],
  ["faq.html", TRY.t("kc.d8")],
  ["kodi.html", TRY.t("kc.d9")],
  ["css/style.css", TRY.t("kc.d10")],
  ["js/app.js", TRY.t("kc.d11")],
  ["js/data.js", TRY.t("kc.d12")]
];
const cache = {};

const esc = TRY.esc;
function highlight(src){
  const re = /(<!--[\s\S]*?-->)|(\/\*[\s\S]*?\*\/|\/\/[^\n]*)|(`(?:\\.|[^`\\])*`|"(?:\\.|[^"\\\n])*"|'(?:\\.|[^'\\\n])*')|(<\/?[A-Za-z][\w-]*(?:\s+[\w-]+(?:=(?:"[^"]*"|'[^']*'|[^\s>]+))?)*\s*\/?>)|(\b\d+(?:\.\d+)?\b)|(\b(?:const|let|var|function|return|if|else|for|while|do|switch|case|break|continue|new|typeof|instanceof|in|of|try|catch|finally|throw|class|extends|import|export|from|default|async|await|null|true|false|undefined|this|document|window|localStorage|navigator|location|JSON|Math|Array|Object|String|Number|Date|Promise|setTimeout|clearTimeout)\b)/g;
  let out = "", last = 0, m;
  while((m = re.exec(src))){
    out += esc(src.slice(last, m.index));
    const tok = m[0];
    if(m[1] || m[2]) out += '<span class="tok-c">' + esc(tok) + "</span>";
    else if(m[3]) out += '<span class="tok-s">' + esc(tok) + "</span>";
    else if(m[4]) out += '<span class="tok-t">' + esc(tok) + "</span>";
    else if(m[5]) out += '<span class="tok-n">' + esc(tok) + "</span>";
    else if(m[6]) out += '<span class="tok-k">' + esc(tok) + "</span>";
    last = m.index + tok.length;
  }
  return out + esc(src.slice(last));
}

async function fetchFile(f){
  if(cache[f]) return cache[f];
  const res = await fetch(f);
  if(!res.ok) throw new Error("HTTP " + res.status);
  const txt = await res.text();
  cache[f] = txt;
  return txt;
}

function renderBody(file, body){
  const f = file.f;
  if(cache[f]){
    body.innerHTML = "<pre>" + highlight(cache[f]) + "</pre>";
    return;
  }
  body.innerHTML = `<p class="hint">${TRY.t("kc.loading")}</p>`;
  fetchFile(f).then(txt => {
    if(body.dataset.loaded === f) body.innerHTML = "<pre>" + highlight(txt) + "</pre>";
  }).catch(() => {
    if(body.dataset.loaded === f){
      body.innerHTML = `<div class="empty" style="border:none;padding:1.6rem">
        <div class="big">📂</div>
        <p>${TRY.t("kc.loadFailT",{f:esc(f)}).replace("{link}",`<a href="https://github.com/erionnezha/tryeza" target="_blank" rel="noopener" style="color:var(--gold)">GitHub</a>`)}</p>
      </div>`;
    }
  });
}

const list = TRY.$("#fileList");
list.innerHTML = FILES.map(([f, desc], i) => `
  <div class="code-file" data-file="${esc(f)}">
    <div class="code-head">
      <span><b>${esc(f)}</b> <span style="color:var(--muted2)">— ${esc(desc)}</span></span>
      <span style="display:flex;gap:.4rem">
        <button data-show="${i}">${TRY.t("kc.show")}</button>
        <button data-copy="${i}">${TRY.t("kc.copy")}</button>
      </span>
    </div>
    <div class="code-body" data-body="${i}"><p class="hint">${TRY.t("kc.clickShow")}</p></div>
  </div>`).join("");

list.addEventListener("click", async e => {
  const sh = e.target.closest("button[data-show]");
  const cp = e.target.closest("button[data-copy]");
  if(sh){
    const i = +sh.dataset.show, f = FILES[i][0];
    const body = list.querySelector(`[data-body="${i}"]`);
    body.dataset.loaded = f;
    sh.textContent = TRY.t("kc.refresh");
    renderBody({ f }, body);
  } else if(cp){
    const i = +cp.dataset.copy, f = FILES[i][0];
    try {
      const txt = await fetchFile(f);
      try { await navigator.clipboard.writeText(txt); }
      catch {
        const ta = document.createElement("textarea");
        ta.value = txt; document.body.appendChild(ta); ta.select();
        document.execCommand("copy"); ta.remove();
      }
      TRY.toast(`<b>${esc(f)}</b> ${TRY.t("kc.copied")}`);
    } catch {
      TRY.toast(TRY.t("kc.copyFail"));
    }
  }
});

TRY.$("#showAll").addEventListener("click", () => {
  FILES.forEach(([f], i) => {
    const body = list.querySelector(`[data-body="${i}"]`);
    body.dataset.loaded = f;
    renderBody({ f }, body);
    const sh = list.querySelector(`button[data-show="${i}"]`);
    if(sh) sh.textContent = TRY.t("kc.refresh");
  });
  TRY.toast(TRY.t("kc.showAllToast"));
});
</script>
</body>
</html>
