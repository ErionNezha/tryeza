<meta name="description" content="Gjej, modifiko ose anulo rezervimet e tua në TRYEZA me kodin TRZ, numrin e telefonit ose emrin.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Ccircle cx='20' cy='20' r='18' fill='%23070b16' stroke='%23d4af37' stroke-width='2'/%3E%3Cpath d='M20 9 L24 20 L20 31 L16 20 Z' fill='%23d4af37'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
<style>
#tryLoader{position:fixed;inset:0;z-index:2000;background:#0e0f12;display:flex;align-items:center;justify-content:center;transition:opacity .6s ease,visibility .6s}
#tryLoader.done{opacity:0;visibility:hidden;pointer-events:none}
#tryLoader .ld-inner{text-align:center;padding:0 1.5rem}
#tryLoader .ld-cloche{width:148px;height:118px;margin:0 auto .9rem}
#tryLoader .ld-cloche svg{width:100%;height:100%;overflow:visible}
#tryLoader .draw{stroke-dasharray:430;stroke-dashoffset:430;animation:lddraw 1.05s ease forwards}
#tryLoader .draw.d2{animation-delay:.16s}#tryLoader .draw.d3{animation-delay:.32s}#tryLoader .draw.d4{animation-delay:.48s}
@keyframes lddraw{to{stroke-dashoffset:0}}
#tryLoader .steam{animation:ldsteam 1.9s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
#tryLoader .steam.s2{animation-delay:.55s}
@keyframes ldsteam{0%,100%{opacity:.15;transform:translateY(3px)}50%{opacity:.9;transform:translateY(-3px)}}
#tryLoader .ld-name{font-family:"Cormorant Garamond",Georgia,serif;font-size:1.9rem;letter-spacing:.42em;padding-left:.42em;color:#ecd9b8}
#tryLoader .ld-tag{color:#a0a0a8;font-size:.82rem;letter-spacing:.14em;margin-top:.65rem;animation:ldpulse 1.7s ease-in-out infinite}
@keyframes ldpulse{0%,100%{opacity:.5}50%{opacity:1}}
#tryLoader .ld-bar{width:210px;max-width:60vw;height:2px;background:rgba(197,168,128,.18);margin:1.25rem auto 0;border-radius:2px;overflow:hidden}
#tryLoader .ld-bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#a8895e,#ecd9b8)}
@media (prefers-reduced-motion:reduce){
#tryLoader .draw{animation:none;stroke-dashoffset:0}
#tryLoader .steam,#tryLoader .ld-tag{animation:none;opacity:1}
}
</style></head>
<body><div id="tryLoader" aria-hidden="true"><div class="ld-inner">
<div class="ld-cloche"><svg viewBox="0 0 120 96" fill="none" aria-hidden="true">
<path class="steam s1" d="M44 32 q5 -7 0 -14 q-5 -7 0 -13" stroke="#c5a880" stroke-width="1.6" stroke-linecap="round"/>
<path class="steam s2" d="M76 32 q-5 -7 0 -14 q5 -7 0 -13" stroke="#c5a880" stroke-width="1.6" stroke-linecap="round"/>
<path class="draw" d="M22 72 A38 38 0 0 1 98 72" stroke="#c5a880" stroke-width="1.8" stroke-linecap="round"/>
<line class="draw d2" x1="14" y1="72" x2="106" y2="72" stroke="#c5a880" stroke-width="1.8" stroke-linecap="round"/>
<circle class="draw d3" cx="60" cy="28" r="4" stroke="#ecd9b8" stroke-width="1.6"/>
<line class="draw d3" x1="60" y1="32" x2="60" y2="37" stroke="#ecd9b8" stroke-width="1.6"/>
<ellipse class="draw d4" cx="60" cy="81" rx="50" ry="8" stroke="#a8895e" stroke-width="1.4"/>
<g class="draw d4" stroke="#c5a880" stroke-width="1.5" stroke-linecap="round">
<line x1="7" y1="52" x2="7" y2="68"/><line x1="3" y1="52" x2="3" y2="60"/><line x1="7" y1="52" x2="7" y2="60"/><line x1="11" y1="52" x2="11" y2="60"/><line x1="3" y1="60" x2="11" y2="60"/>
</g>
<g class="draw d4" stroke="#c5a880" stroke-width="1.5" stroke-linecap="round">
<line x1="113" y1="52" x2="113" y2="68"/><path d="M113 52 L117 52 L115 40 Z" fill="#c5a880" stroke="none" opacity=".85"/>
</g>
</svg></div>
<div class="ld-name">TRYEZA</div>
<div class="ld-tag" data-i18n="loader.tag2">Po bëjmë gati tavolinën tënde...</div>
<div class="ld-bar"><i id="ldFill"></i></div>
</div></div>
<script>(function(){var el=document.getElementById('tryLoader');if(!el)return;
function kill(){if(el.parentNode)el.parentNode.removeChild(el)}
if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches){kill();return}
var fill=document.getElementById('ldFill'),t0=performance.now(),DUR=1300;
function tick(now){var p=Math.min(1,(now-t0)/DUR),e=1-Math.pow(1-p,3);
if(fill)fill.style.width=Math.round(e*100)+'%';if(p<1)requestAnimationFrame(tick);}
requestAnimationFrame(tick);
var exited=false,t0b=Date.now(),MINT=1400;
function exit(){if(exited)return;exited=true;el.classList.add('done');setTimeout(kill,750);}
function ready(){setTimeout(exit,Math.max(0,MINT-(Date.now()-t0b)));}
if(document.readyState==='complete')ready();else{window.addEventListener('load',ready);setTimeout(ready,5000);}})();</script>
<header class="site"></header>
<main class="wrap">
  <div class="page-head">
    <span class="eyebrow" data-i18n="my.eyebrow">Llogaria jote</span>
    <h1 data-i18n="my.h1">Rezervimet e mia</h1>
    <p data-i18n="my.sub">Gjej rezervimin me kodin <b>TRZ-…</b> që more pas rezervimit, me numrin e telefonit ose me emrin tënd.</p>
  </div>
  <section style="padding-top:.4rem">
    <form class="form-card" id="searchForm" autocomplete="off">
      <div class="mrow">
        <label for="q" data-i18n="my.searchLabel">Kodi i rezervimit, telefoni ose emri</label>
        <input id="q" data-i18n-ph="my.searchPh" placeholder="p.sh. TRZ-A8K2M4  ose  069 123 4567  ose  emri yt">
      </div>
      <button class="btn btn-gold" type="submit" style="width:100%" data-i18n="my.searchCta">Kërko rezervimin</button>
      <p class="hint" data-i18n="my.searchHint">Kërkimi i fundit mbahet mend në këtë shfletues.</p>
    </form>
    <div class="divider"></div>
    <div id="results" class="tbl-list" aria-live="polite"></div>
  </section>
</main>
<footer class="site"></footer>

<div class="modal-bg" id="mEdit" role="dialog" aria-modal="true" data-i18n-aria="my.editT" aria-label="Modifiko rezervimin">
  <div class="modal" role="dialog" aria-modal="true" aria-label="Modifiko rezervimin">
    <h2 data-i18n="my.editT">Modifiko rezervimin</h2>
    <p class="hint" id="editInfo" style="margin-bottom:1rem"></p>
    <div class="row2">
      <div class="mrow"><label for="editDate" data-i18n="my.editDate">Data e re</label><input type="date" id="editDate"></div>
      <div class="mrow"><label for="editTime" data-i18n="my.editTime">Ora e re</label><select id="editTime"></select></div>
    </div>
    <div class="hint" id="editAvail" style="margin-top:.4rem"></div>
    <div style="display:flex;gap:.6rem;justify-content:flex-end;margin-top:1.2rem">
      <button class="btn btn-dark btn-sm" data-close data-i18n="my.close">Mbyll</button>
      <button class="btn btn-gold btn-sm" id="editSave" data-i18n="my.save">Ruaj ndryshimet</button>
    </div>
  </div>
</div>

<div class="modal-bg" id="mCancel" role="dialog" aria-modal="true" data-i18n-aria="my.cancelT" aria-label="Anulo rezervimin">
  <div class="modal" role="dialog" aria-modal="true" aria-label="Anulo rezervimin">
    <h2 data-i18n="my.cancelT">Anulo rezervimin</h2>
    <p id="cancelInfo" style="color:var(--muted);margin-bottom:1.2rem"></p>
    <div style="display:flex;gap:.6rem;justify-content:flex-end">
      <button class="btn btn-dark btn-sm" data-close data-i18n="my.keep">Mbaje rezervimin</button>
      <button class="btn btn-gold btn-sm" id="cancelYes" data-i18n="my.yesCancel">Po, anuloje</button>
    </div>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/i18n.js"></script>
<script src="js/app.js"></script>
<script>
"use strict";
TRY.renderChrome("rezervimet.html");
const $ = TRY.$, $$ = TRY.$$;
const LS_SEARCH = "tryeza.searchLast.v1";

const digits = s => String(s || "").replace(/\D/g, "");
function zonaEmer(r, zid){
  if(!zid) return "—";
  const z = (r.zona || []).find(z => z.id === zid);
  return z ? z.emer : zid;
}
function statusPill(st){
  if(st === "anuluar") return `<span class="status-pill st-cancel">${TRY.t("my.stCancelled")}</span>`;
  if(st === "no-show") return `<span class="status-pill st-noshow">${TRY.t("my.stNoshow")}</span>`;
  return `<span class="status-pill st-ok">${TRY.t("my.stActive")}</span>`;
}

function cardHTML(b){
  const r = TRY.restById(b.restId);
  const tblTxt = (b.tavolina && b.tavolina.length) ? b.tavolina.join(", ") : "—";
  const ppl = (b.persona == 1) ? TRY.t("bk.sumPerson") : TRY.t("bk.sumPersons");
  const det = `${TRY.fmtDate(b.date)} · ${TRY.t("my.atTime")} ${TRY.esc(b.time)} · ${b.persona || "—"} ${ppl} · ${TRY.esc(zonaEmer(r, b.zonaId))} · ${TRY.t("my.tblTxt")} ${TRY.esc(tblTxt)}`;
  const menuHtml = TRY.menuLine(b) ? `<div class="d mb-card-line">${TRY.esc(TRY.menuLine(b))}</div>` : "";
  const actions = b.status === "aktive"
    ? `<div class="bk-actions">
        <button class="btn btn-ghost btn-sm" data-act="edit" data-code="${TRY.esc(b.code)}">${TRY.t("my.modify")}</button>
        <button class="btn btn-ghost btn-sm" data-act="ics" data-code="${TRY.esc(b.code)}">${TRY.t("my.ics")}</button>
        <button class="btn btn-ghost btn-sm" data-act="share" data-code="${TRY.esc(b.code)}">🔗 ${TRY.t("share.title")}</button>
        <button class="btn btn-ghost btn-sm" data-act="sharecopy" data-code="${TRY.esc(b.code)}">${TRY.t("share.copy")}</button>
        <button class="btn btn-dark btn-sm" data-act="cancel" data-code="${TRY.esc(b.code)}">${TRY.t("my.cancel")}</button>
      </div>` : "";
  return `<article class="bk-card">
    <div>
      <div class="t">${TRY.esc(r ? r.emer : "Restorant")}</div>
      <div class="d">${TRY.esc((b.emer || b.name) || "")}${(b.telefon || b.phone) ? " · " + TRY.esc(b.telefon || b.phone) : ""}</div>
      <div class="d">${det}</div>
      ${menuHtml}
      <span class="bk-code">${TRY.esc(b.code)}</span>
    </div>
    <div style="display:flex;flex-direction:column;gap:.7rem;align-items:flex-end">${statusPill(b.status)}${actions}</div>
  </article>`;
}

function doSearch(q){
  const box = $("#results");
  q = String(q || "").trim();
  if(!q){
    box.innerHTML = `<div class="empty"><div class="big">🔍</div><p>${TRY.t("my.emptySearch")}</p></div>`;
    return;
  }
  const qd = digits(q), qu = q.toUpperCase(), ql = q.toLowerCase();
  const hits = TRY.bookings().filter(b => {
    if(b.code && b.code.toUpperCase() === qu) return true;
    if(qd.length >= 4 && digits(b.telefon || b.phone || "").includes(qd)) return true;
    if(ql.length >= 2 && String((b.emer || b.name) || "").toLowerCase().includes(ql)) return true;
    return false;
  });
  if(!hits.length){
    box.innerHTML = `<div class="empty"><div class="big">🙁</div><p>${TRY.t("my.noResult",{q:TRY.esc(q)}).replace("{link}",`<a href="faq.html#kontakt" style="color:var(--gold)">${TRY.t("my.contactUs")}</a>`)}</p></div>`;
    return;
  }
  hits.sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time));
  box.innerHTML = `<p class="result-count">${hits.length === 1 ? TRY.t("my.found1") : TRY.t("my.foundN",{n:hits.length})}</p>` + hits.map(cardHTML).join("");
}

/* ---------- modify ---------- */
let editing = null;
function checkEditAvail(){
  if(!editing) return false;
  const r = TRY.restById(editing.restId);
  const si = TRY.slotInfo(r, $("#editDate").value, $("#editTime").value, editing.persona || 2, editing.zonaId);
  const ok = !!si.free;
  $("#editAvail").innerHTML = ok
    ? `<span style="color:var(--green)">${TRY.t("my.availOk",{n:editing.persona || 2})}</span>`
    : `<span style="color:var(--red)">${TRY.t("my.availNo")}</span>`;
  $("#editSave").disabled = !ok;
  return ok;
}
function openEdit(code){
  const b = TRY.bookings().find(x => x.code === code);
  if(!b) return;
  editing = b;
  const r = TRY.restById(b.restId);
  $("#editInfo").innerHTML = `<b>${TRY.esc((b.emer || b.name) || "")}</b> · ${TRY.esc(r ? r.emer : "")} · ${TRY.t("my.nowAt")} <b>${TRY.fmtDate(b.date)}</b>, ${TRY.t("my.atTime")} <b>${TRY.esc(b.time)}</b>`;
  const d = $("#editDate");
  d.min = TRY.todayStr();
  d.value = (b.date >= TRY.todayStr()) ? b.date : TRY.todayStr();
  $("#editTime").innerHTML = TRY.SLOTS.map(s => `<option${s === b.time ? " selected" : ""}>${s}</option>`).join("");
  $("#mEdit").classList.add("open");
  checkEditAvail();
}
$("#editDate").addEventListener("change", checkEditAvail);
$("#editTime").addEventListener("change", checkEditAvail);
$("#editSave").addEventListener("click", () => {
  if(!editing || !checkEditAvail()) return;
  const r = TRY.restById(editing.restId);
  const free = TRY.freeTablesList(r, $("#editDate").value, $("#editTime").value, editing.persona || 2, editing.zonaId)
    .sort((a, b) => a.vende - b.vende);
  TRY.updateBooking(editing.code, {
    date: $("#editDate").value,
    time: $("#editTime").value,
    tavolina: free.length ? [free[0].id] : (editing.tavolina || [])
  });
  $("#mEdit").classList.remove("open");
  TRY.toast(TRY.t("my.updated"));
  doSearch($("#q").value);
});

/* ---------- cancel ---------- */
let cancelling = null;
function openCancel(code){
  const b = TRY.bookings().find(x => x.code === code);
  cancelling = code;
  $("#cancelInfo").innerHTML = b
    ? TRY.t("my.cancelSure",{code:TRY.esc(code),emer:TRY.esc((b.emer || b.name) || ""),data:TRY.fmtDate(b.date),ora:TRY.esc(b.time)})
    : TRY.t("my.cancelSureShort",{code:TRY.esc(code)});
  $("#mCancel").classList.add("open");
}
$("#cancelYes").addEventListener("click", () => {
  TRY.updateBooking(cancelling, { status: "anuluar" });
  $("#mCancel").classList.remove("open");
  TRY.toast(TRY.t("my.cancelled"));
  doSearch($("#q").value);
});

/* ---------- .ics invite ---------- */
function icsEsc(s){ return String(s || "").replace(/\\/g, "\\\\").replace(/;/g, "\\;").replace(/,/g, "\\,").replace(/\n/g, "\\n"); }
function downloadICS(b){
  const r = TRY.restById(b.restId);
  const pad2 = n => String(n).padStart(2, "0");
  const startD = new Date(b.date + "T" + b.time + ":00");
  const endD = new Date(startD.getTime() + 2 * 3600 * 1000);
  const fdt = d => d.getFullYear() + pad2(d.getMonth() + 1) + pad2(d.getDate()) + "T" + pad2(d.getHours()) + pad2(d.getMinutes()) + "00";
  const dt0 = fdt(startD), dt1 = fdt(endD);
  const stamp = new Date().toISOString().replace(/[-:]/g, "").split(".")[0] + "Z";
  const lines = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//TRYEZA//Rezervim//SQ",
    "BEGIN:VEVENT", "UID:" + b.code + "@tryeza.al", "DTSTAMP:" + stamp,
    "DTSTART:" + dt0, "DTEND:" + dt1,
    "SUMMARY:" + icsEsc("Rezervim TRYEZA — " + (r ? r.emer : "")),
    "DESCRIPTION:" + icsEsc("Kodi: " + b.code) + "\\n" + icsEsc((b.persona || "") + " persona"),
    "LOCATION:" + icsEsc(r ? (r.emer + ", " + r.adrese) : ""),
    "END:VEVENT", "END:VCALENDAR"];
  const blob = new Blob([lines.join("\r\n")], { type: "text/calendar;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = b.code + ".ics";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  TRY.toast(TRY.t("my.icsDone"));
}

/* ---------- events ---------- */
$("#results").addEventListener("click", e => {
  const btn = e.target.closest("button[data-act]");
  if(!btn) return;
  const code = btn.dataset.code, act = btn.dataset.act;
  if(act === "edit") openEdit(code);
  else if(act === "cancel") openCancel(code);
  else if(act === "ics"){ const bk = TRY.bookings().find(x => x.code === code); if(bk) downloadICS(bk); }
  else if(act === "share"){ const bk = TRY.bookings().find(x => x.code === code); if(bk) window.open(TRY.shareWhats(bk), "_blank", "noopener"); }
  else if(act === "sharecopy"){ const bk = TRY.bookings().find(x => x.code === code); if(bk) TRY.copyShare(bk); }
});
$$(".modal-bg").forEach(bg => {
  bg.addEventListener("click", e => { if(e.target === bg) bg.classList.remove("open"); });
});
$$("[data-close]").forEach(b => b.addEventListener("click", () => b.closest(".modal-bg").classList.remove("open")));
document.addEventListener("keydown", e => { if(e.key === "Escape") $$(".modal-bg.open").forEach(m => m.classList.remove("open")); });

$("#searchForm").addEventListener("submit", e => {
  e.preventDefault();
  const q = $("#q").value.trim();
  TRY.save(LS_SEARCH, q);
  doSearch(q);
});

/* restore last search */
(function(){
  const last = TRY.load(LS_SEARCH, "");
  if(last){ $("#q").value = last; doSearch(last); }
  else doSearch("");
})();
</script>
</body>
</html>
