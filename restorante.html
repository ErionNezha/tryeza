<meta name="description" content="Shfleto të gjitha restorantet partnere të TRYEZA-s në Tiranë, Korçë, Durrës dhe Shkodër. Filtro sipas kuzhinës, çmimit dhe vlerësimit, dhe shiko disponueshmërinë në kohë reale.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Ccircle cx='20' cy='20' r='18' fill='%23070b16' stroke='%23d4af37' stroke-width='2'/%3E%3Cpath d='M20 8 L24 20 L20 32 L16 20 Z' fill='%23d4af37'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
<style>
.slotbadge{position:absolute;top:.65rem;left:50%;transform:translateX(-50%);z-index:3;
  font-size:.72rem;font-weight:700;padding:.3rem .85rem;border-radius:999px;white-space:nowrap;pointer-events:none}
.slotbadge.ok{background:rgba(62,207,142,.94);color:#06281a;box-shadow:0 4px 14px rgba(0,0,0,.4)}
.slotbadge.busy{background:rgba(255,107,107,.92);color:#3a0d0d}
.slotctx{display:inline-block;margin-bottom:1rem;font-size:.88rem;color:var(--muted);
  border:1px solid var(--line2);border-radius:999px;padding:.45rem 1.1rem;background:rgba(212,175,55,.06)}
.slotctx b{color:var(--gold-lt)}
</style><style>
#tryLoader{position:fixed;inset:0;z-index:2000}
#tryLoader .ld-curtain{position:absolute;top:0;bottom:0;width:50.6%;background:#05080f;transition:transform .85s cubic-bezier(.72,0,.28,1)}
#tryLoader .ld-curtain.left{left:0;border-right:1px solid rgba(212,175,55,.28)}
#tryLoader .ld-curtain.right{right:0;border-left:1px solid rgba(212,175,55,.28)}
#tryLoader .ld-curtain::before{content:"";position:absolute;inset:0;background:url("img/qilim.svg") center/520px repeat;opacity:0;animation:ldqilim 2s ease .35s forwards;-webkit-mask-image:radial-gradient(100% 100% at 50% 42%,#000 12%,transparent 58%);mask-image:radial-gradient(100% 100% at 50% 42%,#000 12%,transparent 58%)}
@keyframes ldqilim{to{opacity:.04}}
#tryLoader.curtain .ld-curtain.left{transform:translateX(-102%)}
#tryLoader.curtain .ld-curtain.right{transform:translateX(102%)}
#tryLoader .ld-stage{position:absolute;inset:0;z-index:1;display:flex;align-items:center;justify-content:center;transition:opacity .4s ease,transform .4s ease}
#tryLoader.curtain .ld-stage{opacity:0;transform:scale(1.07)}
#tryLoader.done{pointer-events:none}
#tryLoader .ld-inner{text-align:center;padding:0 1rem}
#tryLoader .ld-mark{width:104px;height:104px;margin:0 auto 1rem;position:relative;overflow:hidden;border-radius:50%}
#tryLoader .ld-mark svg{width:100%;height:100%;display:block}
#tryLoader .ld-mark .draw{stroke-dasharray:140;stroke-dashoffset:140;animation:lddraw 1.05s cubic-bezier(.6,0,.3,1) forwards}
#tryLoader .ld-mark .draw.d2{animation-delay:.14s}#tryLoader .ld-mark .draw.d3{animation-delay:.28s}
@keyframes lddraw{to{stroke-dashoffset:0}}
#tryLoader .ld-mark::after{content:"";position:absolute;top:-25%;bottom:-25%;width:42%;left:-65%;background:linear-gradient(100deg,transparent,rgba(240,212,122,.55),transparent);transform:skewX(-18deg);animation:ldsweep 1.3s ease .95s forwards}
@keyframes ldsweep{to{left:135%}}
#tryLoader .ld-name{font-family:Georgia,'Times New Roman',serif;font-size:2rem;letter-spacing:.42em;padding-left:.42em;color:#f0d47a;opacity:0;animation:ldfadeup .8s ease .5s forwards}
@keyframes ldfadeup{from{opacity:0;transform:translateY(10px);letter-spacing:.6em}to{opacity:1;transform:none}}
#tryLoader .ld-tag{color:#7d86a1;font-size:.76rem;letter-spacing:.24em;text-transform:uppercase;margin-top:.55rem;min-height:1.3em}
#tryLoader .ld-ch{display:inline-block;opacity:0;animation:ldch .45s ease forwards;animation-delay:calc(.75s + var(--i)*30ms)}
@keyframes ldch{from{opacity:0;transform:translateY(8px);filter:blur(3px)}to{opacity:1;transform:none;filter:none}}
#tryLoader .ld-bar{width:230px;max-width:62vw;height:2px;background:rgba(212,175,55,.16);margin:1.35rem auto .5rem;border-radius:2px;overflow:hidden}
#tryLoader .ld-bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#9c7c24,#f0d47a)}
#tryLoader .ld-pct{font-size:.7rem;letter-spacing:.32em;padding-left:.32em;color:#7d86a1}
@media (prefers-reduced-motion:reduce){
#tryLoader .ld-mark .draw{animation:none;stroke-dashoffset:0}
#tryLoader .ld-mark::after,#tryLoader .ld-curtain::before{display:none}
#tryLoader .ld-name{animation:none;opacity:1}
#tryLoader .ld-ch{animation:none;opacity:1}
#tryLoader .ld-curtain{transition:opacity .3s}
#tryLoader.curtain .ld-curtain{transform:none;opacity:0}
}
</style></head>
<body><div id="tryLoader" aria-hidden="true"><div class="ld-curtain left"></div><div class="ld-curtain right"></div><div class="ld-stage"><div class="ld-inner">
<div class="ld-mark"><svg viewBox="0 0 40 40" fill="none" aria-hidden="true"><circle class="draw" cx="20" cy="20" r="18" stroke="#d4af37" stroke-width="1.4"/><path class="draw d2" d="M20 8 L24 20 L20 32 L16 20 Z" stroke="#f0d47a" stroke-width="1.4"/><path class="draw d3" d="M8 20 L20 16 L32 20 L20 24 Z" stroke="#d4af37" stroke-width="1" opacity=".7"/></svg></div>
<div class="ld-name">TRYEZA</div>
<div class="ld-tag" data-i18n="loader.tag" data-ld-letters>Rezervo tavolinën tënde</div>
<div class="ld-bar"><i id="ldFill"></i></div>
<div class="ld-pct"><span id="ldPct">0</span>%</div>
</div></div></div>
<script>(function(){var el=document.getElementById('tryLoader');if(!el)return;
function kill(){if(el.parentNode)el.parentNode.removeChild(el)}
if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches){kill();return}
var tag=el.querySelector('[data-ld-letters]');
function split(){if(!tag)return;var t=tag.textContent;
if(tag.dataset.txt===t&&tag.querySelector('.ld-ch'))return;
tag.dataset.txt=t;tag.setAttribute('aria-label',t);tag.textContent='';
Array.prototype.forEach.call(t,function(ch,i){var s=document.createElement('span');s.className='ld-ch';s.style.setProperty('--i',i);s.textContent=(ch===' '?'\u00a0':ch);tag.appendChild(s);});}
split();
var fill=document.getElementById('ldFill'),pct=document.getElementById('ldPct'),t0=performance.now(),DUR=1350;
function tick(now){var p=Math.min(1,(now-t0)/DUR),e=1-Math.pow(1-p,3),v=Math.round(e*100);
if(fill)fill.style.width=v+'%';if(pct)pct.textContent=v;if(p<1)requestAnimationFrame(tick);}
requestAnimationFrame(tick);
var exited=false,t0b=Date.now(),MINT=1350;
function exit(){if(exited)return;exited=true;split();
el.classList.add('done');el.classList.add('curtain');setTimeout(kill,1000);}
function ready(){setTimeout(exit,Math.max(0,MINT-(Date.now()-t0b)));}
if(document.readyState==='complete')ready();else{window.addEventListener('load',ready);setTimeout(ready,5000);}})();</script><header class="site"></header><main>
<div class="wrap">
  <div class="page-head">
    <span class="eyebrow" data-i18n="lst.eyebrow">Shfleto</span>
    <h1 data-i18n="lst.h1">Restorantet</h1>
    <p data-i18n="lst.sub">Gjej vendin perfekt për darkën tënde — filtro sipas qytetit, kuzhinës, çmimit dhe vlerësimit.</p>
  </div>

  <form class="filters" id="filters" onsubmit="return false">
    <div>
      <label for="fltQ" data-i18n="flt.search">Kërko</label>
      <input type="search" id="fltQ" data-i18n-ph="flt.searchPh" placeholder="Emër, lagje, kuzhinë…" autocomplete="off">
    </div>
    <div>
      <label for="fltQytet" data-i18n="flt.city">Qyteti</label>
      <select id="fltQytet"></select>
    </div>
    <div>
      <label for="fltKuzhine" data-i18n="flt.cuisine">Kuzhina</label>
      <select id="fltKuzhine"></select>
    </div>
    <div>
      <label for="fltCmim" data-i18n="flt.price">Çmimi</label>
      <select id="fltCmim">
        <option value="" data-i18n="flt.all">Të gjitha</option>
        <option value="1" data-i18n="flt.p1">€ — Ekonomik</option>
        <option value="2" data-i18n="flt.p2">€€ — Mesatar</option>
        <option value="3" data-i18n="flt.p3">€€€ — Premium</option>
      </select>
    </div>
    <div>
      <label for="fltRating" data-i18n="flt.rating">Vlerësimi</label>
      <select id="fltRating">
        <option value="" data-i18n="flt.all">Të gjitha</option>
        <option value="3.5" data-i18n="flt.r35">3.5+ yje</option>
        <option value="4" data-i18n="flt.r4">4.0+ yje</option>
        <option value="4.5" data-i18n="flt.r45">4.5+ yje</option>
      </select>
    </div>
    <div>
      <label for="fltRendit" data-i18n="flt.sort">Renditja</label>
      <select id="fltRendit">
        <option value="rek" data-i18n="flt.sRek">E rekomanduar</option>
        <option value="rating" data-i18n="flt.sRating">Vlerësimi</option>
        <option value="cmim-asc" data-i18n="flt.sAsc">Çmimi: rritës</option>
        <option value="cmim-desc" data-i18n="flt.sDesc">Çmimi: zbritës</option>
      </select>
    </div>
    <div style="display:flex;align-items:flex-end">
      <button type="button" class="btn btn-ghost btn-sm" id="btnClear" style="width:100%" data-i18n="flt.clear">Pastro filtrat</button>
    </div>
  </form>

  <div id="slotCtx"></div>
  <p class="result-count" id="resultCount"></p>
  <div class="grid-cards" id="grid"></div>
  <div class="empty" id="emptyState" hidden>
    <div class="big">🍽️</div>
    <p><strong style="color:var(--text)" data-i18n="lst.emptyT">Nuk u gjet asnjë restorant</strong> <span data-i18n="lst.emptyD">me këto filtra.<br>Provo të heqësh disa filtra për më shumë rezultate.</span></p>
    <div style="margin-top:1rem"><button class="btn btn-gold btn-sm" id="btnClear2" type="button" data-i18n="lst.emptyCta">Pastro filtrat</button></div>
  </div>
</div>
</main><footer class="site"></footer>
<script src="js/data.js"></script>
<script src="js/i18n.js"></script>
<script src="js/app.js"></script>
<script>
TRY.renderChrome('restorante.html');
(function(){
  "use strict";
  const R = ((typeof RESTORANTET!=="undefined" && RESTORANTET) || window.RESTORANTET || []);
  const RATINGS_OK = ["3.5","4","4.5"];
  const RENDIT_OK = ["rek","rating","cmim-asc","cmim-desc"];

  /* ---- Lexo parametrat e URL-së ---- */
  const P = new URLSearchParams(location.search);
  const state = {
    q: (P.get("q") || "").trim(),
    qytet: TRY.QYTETET.includes(P.get("qytet")) ? P.get("qytet") : "",
    kuzhine: (P.get("kuzhine") || "").trim(),
    cmim: ["1","2","3"].includes(P.get("cmim")) ? P.get("cmim") : "",
    minrating: RATINGS_OK.includes(P.get("minrating")) ? parseFloat(P.get("minrating")) : 0,
    rendit: RENDIT_OK.includes(P.get("rendit")) ? P.get("rendit") : "rek",
    data: (P.get("data") || "").trim(),
    ora: TRY.SLOTS.includes(P.get("ora")) ? P.get("ora") : "",
    persona: parseInt(P.get("persona") || "2", 10)
  };
  if(!(state.persona >= 1 && state.persona <= 20)) state.persona = 2;
  const hasSlot = /^\d{4}-\d{2}-\d{2}$/.test(state.data) && state.data >= TRY.todayStr() && state.ora !== "";

  /* ---- Kontrollet ---- */
  const fltQ = TRY.$("#fltQ"), fltQytet = TRY.$("#fltQytet"), fltKuzhine = TRY.$("#fltKuzhine"),
        fltCmim = TRY.$("#fltCmim"), fltRating = TRY.$("#fltRating"), fltRendit = TRY.$("#fltRendit");

  fltQ.value = state.q;
  fltQytet.innerHTML = `<option value="">${TRY.t("flt.allCities")}</option>` +
    TRY.QYTETET.map(q => `<option value="${TRY.esc(q)}"${q===state.qytet?" selected":""}>${TRY.esc(q)}</option>`).join("");
  const kuzhinat = [...new Set(R.flatMap(r => r.kuzhina || []))].sort((a,b)=>a.localeCompare(b,"sq"));
  fltKuzhine.innerHTML = `<option value="">${TRY.t("flt.allCuisines")}</option>` +
    kuzhinat.map(k => `<option value="${TRY.esc(k)}"${k===state.kuzhine?" selected":""}>${TRY.esc(k)}</option>`).join("");
  fltCmim.value = state.cmim;
  fltRating.value = state.minrating ? String(state.minrating) : "";
  fltRendit.value = state.rendit;

  /* ---- Konteksti i disponueshmërisë ---- */
  const slotCtx = TRY.$("#slotCtx");
  if(hasSlot){
    slotCtx.innerHTML = `<span class="slotctx">${TRY.t("lst.slotFor")} <b>${TRY.esc(TRY.fmtDate(state.data))}</b> · <b>${TRY.esc(state.ora)}</b> · <b>${state.persona} ${TRY.t("lst.persons")}</b></span>`;
  } else {
    slotCtx.innerHTML = "";
  }

  function badgeFor(r){
    if(!hasSlot) return "";
    const s = TRY.slotInfo(r, state.data, state.ora, state.persona);
    return s.free
      ? `<span class="slotbadge ok">${TRY.t("lst.badgeFree")} ${TRY.esc(state.ora)}</span>`
      : `<span class="slotbadge busy">${TRY.t("lst.badgeBusy")}</span>`;
  }

  /* ---- Filtrim + renditje + render ---- */
  function applyFilters(){
    const qn = state.q.toLowerCase();
    let list = R.filter(r => {
      if(qn && !(r.emer.toLowerCase().includes(qn) ||
                 (r.lagje||"").toLowerCase().includes(qn) ||
                 (r.kuzhina||[]).some(k => k.toLowerCase().includes(qn)))) return false;
      if(state.qytet && r.qytet !== state.qytet) return false;
      if(state.kuzhine && !(r.kuzhina||[]).includes(state.kuzhine)) return false;
      if(state.cmim && String(r.cmim) !== state.cmim) return false;
      if(state.minrating && TRY.liveRating(r.id).r < state.minrating) return false;
      return true;
    });
    const lr = id => TRY.liveRating(id);
    if(state.rendit === "rating") list.sort((a,b) => lr(b.id).r - lr(a.id).r);
    else if(state.rendit === "cmim-asc") list.sort((a,b) => a.cmim - b.cmim);
    else if(state.rendit === "cmim-desc") list.sort((a,b) => b.cmim - a.cmim);
    else list.sort((a,b) => (lr(b.id).r * lr(b.id).n) - (lr(a.id).r * lr(a.id).n));

    const grid = TRY.$("#grid"), empty = TRY.$("#emptyState");
    grid.innerHTML = list.map(r => {
      const badge = badgeFor(r);
      const html = TRY.cardHTML(r);
      return badge ? html.replace(/(<article[^>]*>)/, "$1" + badge) : html;
    }).join("");
    TRY.bindFavs(grid);
    grid.hidden = !list.length;
    empty.hidden = !!list.length;
    TRY.$("#resultCount").innerHTML =
      list.length === 1 ? TRY.t("lst.res1") : TRY.t("lst.resN",{n:list.length});
  }

  function syncURL(){
    const q = new URLSearchParams();
    if(state.q) q.set("q", state.q);
    if(state.qytet) q.set("qytet", state.qytet);
    if(state.kuzhine) q.set("kuzhine", state.kuzhine);
    if(state.cmim) q.set("cmim", state.cmim);
    if(state.minrating) q.set("minrating", String(state.minrating));
    if(state.rendit !== "rek") q.set("rendit", state.rendit);
    if(state.data) q.set("data", state.data);
    if(state.ora) q.set("ora", state.ora);
    q.set("persona", String(state.persona));
    const qs = q.toString();
    history.replaceState(null, "", "restorante.html" + (qs ? "?" + qs : ""));
  }

  function pullFromControls(){
    state.q = fltQ.value.trim();
    state.qytet = fltQytet.value;
    state.kuzhine = fltKuzhine.value;
    state.cmim = fltCmim.value;
    state.minrating = fltRating.value ? parseFloat(fltRating.value) : 0;
    state.rendit = fltRendit.value;
    syncURL();
    applyFilters();
  }

  let deb;
  fltQ.addEventListener("input", () => { clearTimeout(deb); deb = setTimeout(pullFromControls, 250); });
  [fltQytet, fltKuzhine, fltCmim, fltRating, fltRendit].forEach(el =>
    el.addEventListener("change", pullFromControls));

  function clearAll(){
    Object.assign(state, {q:"", qytet:"", kuzhine:"", cmim:"", minrating:0, rendit:"rek"});
    fltQ.value = ""; fltQytet.value = ""; fltKuzhine.value = "";
    fltCmim.value = ""; fltRating.value = ""; fltRendit.value = "rek";
    syncURL();
    applyFilters();
  }
  TRY.$("#btnClear").addEventListener("click", clearAll);
  TRY.$("#btnClear2").addEventListener("click", clearAll);

  applyFilters();
})();
</script></body></html>
