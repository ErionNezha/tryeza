  </svg>
  <h1>TRYEZA</h1>
  <p id="msg">Nuk ka lidhje interneti për momentin.<br>Kontrollo rrjetin dhe provo sërish — tavolina jote të pret.</p>
  <button id="retry" type="button">Provo sërish</button>

<script>
  (function () {
    try {
      if (localStorage.getItem("tryeza.lang.v1") === "en") {
        document.documentElement.lang = "en";
        document.title = "TRYEZA — Offline";
        document.getElementById("msg").innerHTML = "You appear to be offline.<br>Check your connection and try again — your table is waiting.";
        document.getElementById("retry").textContent = "Try again";
      }
    } catch (e) {}
    document.getElementById("retry").addEventListener("click", function () { location.reload(); });
  })();
</script>
